<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something Went Wrong</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      .box {
        width: 90%;
        max-width: 500px;
        padding: 40px 25px;
        text-align: center;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      }

      .icon {
        font-size: 60px;
        margin-bottom: 15px;
      }

      h1 {
        margin: 10px 0;
        font-size: 30px;
        color: #222;
      }

      p {
        color: #777;
        line-height: 1.6;
        font-size: 16px;
      }

      .buttons {
        margin-top: 25px;
      }

      a,
      button {
        display: inline-block;
        padding: 12px 22px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
      }

      .home {
        background: #4caf50;
        color: white;
      }

      .retry {
        background: #eeeeee;
        color: #333;
      }

      .home:hover {
        background: #43a047;
      }

      .retry:hover {
        background: #dddddd;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="icon">⚠️</div>

      <h1>Oops! Something Went Wrong</h1>

      <p>
        We're sorry for the inconvenience. Something unexpected happened while
        loading this page. Please try again or go back to the homepage.
      </p>

      <div class="buttons">
        <button class="retry" onclick="location.reload()">Try Again</button>

        <a href="index.html" class="home"> Go Home </a>
      </div>
    </div>
  </body>
</html>
